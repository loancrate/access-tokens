packages:
  - packages/*

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

overrides:
  brace-expansion@<5.0.6: ^5.0.6
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  fast-xml-builder@<1.1.7: ^1.1.7
  fast-xml-parser: ^5.7.0
  flatted: 3.4.2
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  ip-address@<10.1.1: ^10.1.1
  minimatch: 10.2.3
  path-to-regexp@>=8.0.0 <8.4.0: ^8.4.0
  picomatch@<2.3.2: ^2.3.2
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  postcss@<8.5.10: ^8.5.10
  qs@<6.15.2: ^6.15.2
  vite@>=7.0.0 <7.3.5: ^7.3.5
  yaml@>=2.0.0 <2.8.3: ^2.8.3

auditConfig:
  ignoreGhsas:
    # js-yaml GHSA-h67p-54hq-rp68 (quadratic-complexity DoS via repeated merge-key
    # aliases) is patched only in js-yaml >=4.2.0; there is no 3.x patch. The sole
    # consumer is @changesets/parse@0.4.1 (dev/CI release tooling), which depends on
    # js-yaml@^3.13.1 and calls the safeLoad API removed in 4.x, so forcing 4.2.0
    # would break `pnpm changeset`. It parses only repo-authored .changeset/*.md
    # frontmatter, never untrusted input, so the DoS is not reachable. Revisit when
    # @changesets/parse adopts js-yaml >=4.2.0 (then drop this and let it bump) or a
    # 3.x patch ships.
    - GHSA-h67p-54hq-rp68
