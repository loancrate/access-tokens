name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, changeset-release/**]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    services:
      # Floci, a drop-in replacement for LocalStack Community: same port, same
      # test/test credentials, same health endpoint, no auth token. Pinned by
      # digest because Floci releases every week or two.
      #
      # No SERVICES here: Floci has no service-gating knob and starts
      # everything regardless, so declaring one would only mislead. For verbose
      # logs, set QUARKUS_LOG_LEVEL: DEBUG.
      #
      # ROLLBACK: image: localstack/localstack:4.10, and restore
      #   env:
      #     SERVICES: dynamodb
      #     DEBUG: 1
      aws-emulator:
        image: floci/floci:1.5.34@sha256:b3b3a70a294b8ba8095385b8571ea1e4d44d494950d98de5e812cd9de02f506b
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run smoke tests (on built artifacts)
        run: pnpm test-smoke

      - name: Run format check
        run: pnpm format:check

      - name: Run type checks (includes tests)
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.node-version == '24.x'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/*/coverage/coverage-*.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            packages/*/*-junit.xml
            packages/*/coverage
