name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, changeset-release/**]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    # No services: block. The emulator is started explicitly below, from the
    # same docker-compose.yml developers use, so the image digest is pinned in
    # one place and CI exercises the code path developers do.
    #
    # A services: block would be roughly equivalent here, and is worth
    # reconsidering if either of its real advantages starts applying:
    #
    #   - it resolves services by hostname when the job itself runs in a
    #     container, which ours does not
    #   - it takes registry credentials directly, which would matter if we
    #     mirror the Floci image to our own registry
    #
    # Its automatic log capture is replaced by the failure step below.

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run smoke tests (on built artifacts)
        run: pnpm test-smoke

      - name: Run format check
        run: pnpm format:check

      - name: Run type checks (includes tests)
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      # Blocks on the compose healthcheck, so the emulator is ready before the
      # tests start. `pnpm test:coverage` then finds it listening and reuses it.
      - name: Start AWS emulator
        run: docker compose up -d --wait aws-emulator

      - name: Run tests
        run: pnpm test:coverage

      # GitHub dumps service-container logs automatically; compose does not.
      - name: Emulator logs on failure
        if: failure()
        run: docker compose logs --tail 200 aws-emulator

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.node-version == '24.x'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/*/coverage/coverage-*.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            packages/*/*-junit.xml
            packages/*/coverage
