# Local AWS emulator for the integration tests and the example app.
#
# Floci is a drop-in replacement for LocalStack Community: same port, same
# test/test credentials, same /_localstack/health endpoint, no auth token.
#
# CI uses this file too, via the Start AWS emulator step in
# .github/workflows/ci.yml, so the image is pinned in exactly one place.
#
# Deliberately no `name:`. Compose derives the project from the checkout
# directory, so every worktree gets its own emulator. Pinning a shared name
# would make the emulator a resource worktrees fight over: `up` with a
# different port recreates the one container on the new port, cutting off a
# run already using the old one. The monorepo pins its project name because
# relative bind mounts have to resolve to the primary checkout; this file has
# no volumes, so there is nothing to anchor and nothing to share.

services:
  aws-emulator:
    # Pinned by digest because Floci ships a release every week or two.
    image: floci/floci:1.5.34@sha256:b3b3a70a294b8ba8095385b8571ea1e4d44d494950d98de5e812cd9de02f506b
    ports:
      # Keep the container's internal port at 4566 and remap host-side.
      # Emulators build the endpoints they hand out from their own base URL,
      # which no port variable updates, so moving the internal port breaks
      # those silently. scripts/start-aws-emulator.sh derives AWS_EMULATOR_PORT
      # from AWS_ENDPOINT_URL so there is one knob rather than two.
      - "${AWS_EMULATOR_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 5s
      retries: 30
